name: Poll job sites and send ntfy notifications

on:
  schedule:
    # 30분마다, 단 한국시간(KST, UTC+9) 09:00~24:00에만 실행.
    # UTC 0~14시 = KST 09:00~23:59 (KST 00:00~09:00은 조용히 쉼)
    - cron: '*/30 0-14 * * *'
  workflow_dispatch:
    inputs:
      max_per_site:
        description: '사이트당 이번 실행에서 보낼 최대 알림 수 (한 번에 밀린 걸 다 정리하고 싶으면 크게, 예: 999)'
        required: false
        default: '10'

permissions:
  contents: write

# 두 실행이 겹치면 둘 다 같은(아직 커밋 전) seen.json을 보고 시작해서 같은 공고를
# 중복으로 알리게 된다. 반드시 한 번에 하나씩, 순서대로만 돌게 줄을 세운다.
concurrency:
  group: poll-jobs
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run job scraper
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAX_PER_SITE: ${{ github.event.inputs.max_per_site || '10' }}
        run: node scripts/fetch-jobs.js

      - name: Commit seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update seen jobs"
          # 그 사이 다른 커밋이 먼저 push됐으면(예: 코드 수정) 그냥 실패하고 끝내지 않고
          # 최신 상태를 받아 다시 얹어서 재시도한다. 이게 안 되면 seen.json이 실제로는
          # 저장 안 된 채로 넘어가서 다음 실행 때 같은 알림이 또 나가게 된다.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push failed, fetching and retrying ($i)..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push data/seen.json after retries - notifications will repeat next run"
          exit 1
