name: Poll job sites and send ntfy notifications

on:
  schedule:
    # 30분마다, 단 한국시간(KST, UTC+9) 09:00~24:00에만 실행.
    # UTC 0~14시 = KST 09:00~23:59 (KST 00:00~09:00은 조용히 쉼)
    - cron: '*/30 0-14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run job scraper
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/fetch-jobs.js

      - name: Commit seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "chore: update seen jobs" || echo "no changes to commit"
          git push
