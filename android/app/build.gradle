apply plugin: 'com.android.application'

android {
    namespace 'com.jobapi.wrap'
    compileSdk 34

    defaultConfig {
        applicationId "com.jobapi.wrap"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
