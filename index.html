<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>실시간 구인 불러오기 · 차량 랩핑/PPF 채용 바로가기</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FFFFFF" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F2F5; --panel:#FFFFFF; --surface:#F6F7F9; --line:rgba(15,23,32,.09);
    --text:#14161A; --text-dim:#5B6270; --text-mute:#8A909B;
    --accent:#3D6E8C; --yellow:#B8860B; --orange:#C0451B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);
    -webkit-tap-highlight-color:transparent;}
  .display{font-family:'Oswald',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .app{max-width:400px;margin:24px auto;background:var(--panel);border:1px solid var(--line);
    border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,32,.12);
    min-height:calc(100vh - 48px);}
  header{padding:24px 20px 16px;background:linear-gradient(#FAFBFC,var(--panel));border-bottom:1px solid var(--line);position:relative;}
  header .brand{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  header .brand span{font-weight:600;font-size:18px;letter-spacing:.02em;}
  header p{margin:0;font-size:12.5px;color:var(--text-dim);}
  .close-btn{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:8px;
    background:var(--surface);color:var(--text-dim);border:1px solid var(--line);font-size:14px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .close-hint{position:absolute;top:52px;right:16px;font-size:10.5px;color:var(--text-mute);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;
    max-width:150px;text-align:right;line-height:1.4;display:none;}
  .banner{margin:16px 20px 0;display:flex;gap:8px;background:rgba(61,110,140,.1);
    border:1px solid rgba(61,110,140,.25);border-radius:10px;padding:10px 12px;}
  .banner p{margin:0;font-size:11.5px;color:var(--accent);line-height:1.5;}
  .section{padding:16px 20px 0;}
  .label{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
  .kw-preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .kw-preset{font-size:12px;padding:5px 11px;border-radius:999px;background:rgba(15,23,32,.045);
    color:var(--text-dim);border:1px solid var(--line);cursor:pointer;}
  .kw-preset.active{background:rgba(184,134,11,.15);color:var(--yellow);border-color:rgba(184,134,11,.3);}
  .kw-custom-row{display:flex;gap:8px;margin-bottom:14px;}
  .kw-custom-input{flex:1;background:rgba(15,23,32,.045);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:12.5px;color:var(--text);outline:none;}
  .kw-custom-btn{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:0 14px;border-radius:8px;
    background:rgba(61,110,140,.18);color:var(--accent);border:1px solid rgba(61,110,140,.3);cursor:pointer;}
  .tabs{display:flex;gap:20px;padding:0 20px;margin-top:18px;border-bottom:1px solid var(--line);}
  .tab{background:none;border:none;color:var(--text-mute);font-family:'Oswald',sans-serif;
    font-size:13px;letter-spacing:.02em;padding-bottom:12px;border-bottom:2px solid transparent;cursor:pointer;}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .panel{display:none;padding:16px 20px 24px;}
  .panel.active{display:block;}
  .site-tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;
    border-bottom:1px solid var(--line);}
  .site-tabbar::-webkit-scrollbar{display:none;}
  .site-tab{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;
    background:var(--surface);color:var(--text);border:1px solid rgba(15,23,32,.18);cursor:pointer;white-space:nowrap;}
  .site-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .frame-wrap{position:relative;width:100%;height:62vh;min-height:420px;border-radius:12px;overflow:hidden;
    border:1px solid var(--line);background:var(--surface);}
  .frame-wrap.expanded{position:fixed;inset:0;z-index:100;height:100vh;min-height:0;border-radius:0;
    max-width:none;}
  .frame-expand-btn{position:absolute;top:8px;right:8px;z-index:2;width:32px;height:32px;border-radius:8px;
    background:rgba(255,255,255,.9);color:var(--text);border:1px solid var(--line);font-size:15px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);}
  .frame-status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12.5px;color:var(--text-mute);z-index:1;}
  .frame-scroll{position:absolute;inset:0;overflow:auto;display:none;}
  .site-frame{border:none;background:#fff;display:block;transform-origin:top left;}
  .frame-fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;text-decoration:none;padding:24px;text-align:center;}
  .frame-fallback span:first-child{font-size:13px;color:var(--text-dim);line-height:1.5;}
  .frame-fallback-btn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--yellow);
    border:1px solid rgba(184,134,11,.35);background:rgba(184,134,11,.1);padding:8px 16px;border-radius:999px;}
  .site-card{display:flex;justify-content:space-between;align-items:center;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:inherit;}
  .site-name{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);color:var(--text-mute);}
  .badge.direct{color:var(--accent);border-color:rgba(61,110,140,.3);background:rgba(61,110,140,.1);}
  .site-note{font-size:11.5px;color:var(--text-mute);margin:3px 0 0;}
  .site-arrow{color:var(--text-mute);font-size:14px;}
  .home-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .copy-btn{font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 10px;border-radius:8px;
    background:rgba(61,110,140,.18);color:var(--accent);border:1px solid rgba(61,110,140,.3);cursor:pointer;
    white-space:nowrap;}
  .copy-btn.copied{background:rgba(184,134,11,.15);color:var(--yellow);border-color:rgba(184,134,11,.3);}
  .home-open{color:var(--text-mute);font-size:14px;text-decoration:none;padding:4px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="close-btn" id="closeBtn" title="종료">✕</button>
    <div class="close-hint" id="closeHint">브라우저 보안 정책상 자동으로 못 닫아요. 탭을 직접 닫아주세요.</div>
    <div class="brand">
      <span style="color:var(--accent);">🚗</span>
      <span class="display">실시간 구인 불러오기</span>
    </div>
    <p>차량 랩핑 · PPF 기술직 채용 바로가기</p>
  </header>

  <div class="banner">
    <p>검색어를 고르면 아래 세 탭이 모두 갱신돼요. 미리보기는 화면 안에서 바로 보이고, 바로검색은 새 탭에서 결과가 바로 열리고, 홈에서 검색은 검색어를 복사해서 붙여넣으면 돼요.</p>
  </div>

  <div class="section">
    <div class="label">🔤 검색어</div>
    <div class="kw-preset-row" id="kwPresetRow"></div>
    <div class="kw-custom-row">
      <input id="kwCustomInput" class="kw-custom-input" placeholder="직접 입력 (예: 랩핑기사)" />
      <button class="kw-custom-btn" onclick="applyCustomKw()">적용</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="preview">미리보기</button>
    <button class="tab" data-tab="direct">바로검색</button>
    <button class="tab" data-tab="home">홈에서 검색</button>
  </div>

  <div class="panel active" id="panel-preview">
    <div class="site-tabbar" id="siteTabbar"></div>
    <div class="frame-wrap" id="frameWrap">
      <button class="frame-expand-btn" id="frameExpandBtn" title="전체화면으로 보기">⤢</button>
      <div class="frame-status" id="frameStatus">불러오는 중…</div>
      <div class="frame-scroll" id="frameScroll">
        <iframe id="siteFrame" class="site-frame" title="site preview"></iframe>
      </div>
      <a id="frameFallback" class="frame-fallback" target="_blank" rel="noopener noreferrer" style="display:none;">
        <span>⚠️ 이 사이트는 화면 안에 표시할 수 없어요</span>
        <span class="frame-fallback-btn">새 탭에서 열기 ↗</span>
      </a>
    </div>
  </div>

  <div class="panel" id="panel-direct">
    <div id="directList"></div>
  </div>

  <div class="panel" id="panel-home">
    <div id="homeList"></div>
  </div>
</div>

<script>
// 이미 검색어가 적용된 URL을 그대로 iframe에 넣어서 보여준다 (홈 열고 검색창에 입력하는
// 단계 없이, 한 번에 검색결과 URL로 바로 로드). 잡코리아는 폭이 좁으면 레이아웃이 깨져서
// 넓게(1100px) 띄운 뒤 화면 크기에 맞게 축소(scale)해서 보여준다.
const previewSites = [
  {name:"사람인", icon:"💼", urlTpl:"https://www.saramin.co.kr/zf_user/search/recruit?searchword={kw}"},
  {name:"잡코리아", icon:"🏢", urlTpl:"https://www.jobkorea.co.kr/Search/?stext={kw}", nativeWidth:420, nativeHeight:1400},
];

// 검색어를 URL에 실어서 결과가 바로 열리는 사이트 (새 탭)
const directSites = [
  {name:"알바몬", urlTpl:"https://www.albamon.com/total-search?keyword={kw}"},
  {name:"원티드", urlTpl:"https://www.wanted.co.kr/search?query={kw}"},
];

// 검색어를 URL로 넘길 방법이 없어 사이트 안에서 직접 검색해야 하는 곳 (검색어 복사 버튼 제공)
const homeSites = [
  {name:"알바천국", url:"https://www.alba.co.kr/"},
  {name:"인크루트", url:"https://www.incruit.com/"},
  {name:"고용24 (고용노동부)", url:"https://www.work24.go.kr/wk/a/b/1200/retriveDtlEmpSrchList.do"},
  {name:"당근 알바", url:"https://www.daangn.com/kr/jobs/"},
];

const KEYWORD_PRESETS = ["차량랩핑", "랩핑", "PPF", "랩핑,PPF", "차량랩핑,PPF"];
let currentKw = KEYWORD_PRESETS[0];
let currentPreviewIndex = 0;

function fillKw(urlTpl, kw){
  return urlTpl.replace("{kw}", encodeURIComponent(kw));
}

function renderKwPresets(){
  document.getElementById("kwPresetRow").innerHTML = KEYWORD_PRESETS.map(k =>
    `<button class="kw-preset ${k===currentKw?'active':''}" data-k="${k}">${k}</button>`
  ).join("");
  document.getElementById("kwPresetRow").querySelectorAll(".kw-preset").forEach(btn => {
    btn.addEventListener("click", () => {
      currentKw = btn.dataset.k;
      refreshAll();
    });
  });
}

function applyCustomKw(){
  const v = document.getElementById("kwCustomInput").value.trim();
  if(!v) return;
  currentKw = v;
  refreshAll();
}

function refreshAll(){
  renderKwPresets();
  renderDirectList();
  renderHomeList();
  loadPreview(previewSites[currentPreviewIndex]);
}

function renderDirectList(){
  document.getElementById("directList").innerHTML = directSites.map(s => `
    <a class="site-card" href="${fillKw(s.urlTpl, currentKw)}" target="_blank" rel="noopener noreferrer">
      <div>
        <div class="site-name">${s.name} <span class="badge direct">바로검색</span></div>
        <p class="site-note">검색 결과 바로 표시</p>
      </div>
      <span class="site-arrow">↗</span>
    </a>`).join("");
}

function renderHomeList(){
  document.getElementById("homeList").innerHTML = homeSites.map((s,i) => `
    <div class="site-card">
      <div>
        <div class="site-name">${s.name} <span class="badge">홈</span></div>
        <p class="site-note">"${currentKw}" 복사해서 검색해보세요</p>
      </div>
      <div class="home-actions">
        <button class="copy-btn" data-i="${i}">복사</button>
        <a class="home-open" href="${s.url}" target="_blank" rel="noopener noreferrer">↗</a>
      </div>
    </div>`).join("");
  document.getElementById("homeList").querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(currentKw);
        btn.textContent = "복사됨";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "복사"; btn.classList.remove("copied"); }, 1200);
      }catch(e){}
    });
  });
}

function toggleExpand(){
  const wrap = document.getElementById("frameWrap");
  const btn = document.getElementById("frameExpandBtn");
  const expanded = wrap.classList.toggle("expanded");
  btn.textContent = expanded ? "✕" : "⤢";
  btn.title = expanded ? "닫기" : "전체화면으로 보기";
  applyFrameScale();
}

function applyFrameScale(){
  const site = previewSites[currentPreviewIndex];
  const frame = document.getElementById("siteFrame");
  const scroll = document.getElementById("frameScroll");
  if(!site.nativeWidth){
    frame.style.width = "100%";
    frame.style.height = "100%";
    frame.style.transform = "none";
    scroll.style.overflow = "hidden";
    return;
  }
  const containerWidth = document.getElementById("frameWrap").clientWidth;
  const scale = containerWidth / site.nativeWidth;
  frame.style.width = site.nativeWidth + "px";
  frame.style.height = site.nativeHeight + "px";
  frame.style.transform = `scale(${scale})`;
  scroll.style.overflow = "auto";
}

function loadPreview(site){
  const status = document.getElementById("frameStatus");
  const scroll = document.getElementById("frameScroll");
  const frame = document.getElementById("siteFrame");
  const fallback = document.getElementById("frameFallback");
  const url = fillKw(site.urlTpl, currentKw);
  status.style.display = "flex";
  status.textContent = "불러오는 중…";
  scroll.style.display = "none";
  fallback.style.display = "none";
  fallback.href = url;
  frame.src = url;
  applyFrameScale();

  const check = setTimeout(() => {
    try{
      const blocked = frame.contentWindow.location.href === "about:blank";
      if(blocked){
        status.style.display = "none";
        scroll.style.display = "none";
        fallback.style.display = "flex";
      } else {
        status.style.display = "none";
        scroll.style.display = "block";
      }
    }catch(e){
      status.style.display = "none";
      scroll.style.display = "block";
    }
  }, 2200);

  frame.onload = () => {
    clearTimeout(check);
    try{
      if(frame.contentWindow.location.href === "about:blank") return;
    }catch(e){}
    status.style.display = "none";
    scroll.style.display = "block";
  };
}

document.getElementById("frameExpandBtn").addEventListener("click", toggleExpand);
window.addEventListener("resize", applyFrameScale);

document.getElementById("siteTabbar").innerHTML = previewSites.map((s,i) =>
  `<button class="site-tab ${i===currentPreviewIndex?'active':''}" data-i="${i}">${s.icon} ${s.name}</button>`
).join("");
document.getElementById("siteTabbar").addEventListener("click", (e) => {
  const btn = e.target.closest(".site-tab");
  if(!btn) return;
  currentPreviewIndex = +btn.dataset.i;
  document.querySelectorAll(".site-tab").forEach(t=>t.classList.toggle("active", t===btn));
  loadPreview(previewSites[currentPreviewIndex]);
});

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if(!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t===btn));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  if(btn.dataset.tab === "preview") applyFrameScale();
});

document.getElementById("closeBtn").addEventListener("click", () => {
  // 앱(APK) 안에서 열렸으면 네이티브 브릿지로 확실하게 종료.
  if (window.AndroidApp && window.AndroidApp.closeApp) {
    window.AndroidApp.closeApp();
    return;
  }
  // 일반 브라우저에서는 window.close()를 시도 (스크립트로 열지 않은 탭/방문 기록이
  // 남은 탭은 브라우저가 막는다 - 500ms 뒤에도 이 코드가 실행 중이면 안내 문구를 보여준다).
  window.close();
  setTimeout(() => {
    const hint = document.getElementById("closeHint");
    hint.style.display = "block";
    setTimeout(() => { hint.style.display = "none"; }, 3000);
  }, 500);
});

renderKwPresets();
renderDirectList();
renderHomeList();
loadPreview(previewSites[currentPreviewIndex]);

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
